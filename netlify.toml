# Netlify Configuration for Smart Inventory System (Vite Frontend SPA)

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api directly to your Render backend service
# This completely eliminates browser cross-origin CORS issues!
[[redirects]]
  from = "/api/*"
  to = "https://sim-smart-inventory-system.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: redirect all client-side routes to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Best-practice security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
