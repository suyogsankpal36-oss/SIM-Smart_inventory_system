services:
  db:
    image: mariadb:10.11
    container_name: smart_inventory_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: 
      MYSQL_USER: 
      MYSQL_PASSWORD: 
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_inventory_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: 
      DEBUG: False
      ALLOWED_HOSTS: 
      DB_ENGINE: mysql
      DB_NAME: 
      DB_USER: 
      DB_PASSWORD: 
      DB_HOST: db
      DB_PORT: 3306
      CORS_ALLOWED_ORIGINS: 
      CSRF_TRUSTED_ORIGINS: 
    volumes:
      - media_data:/app/media
    expose:
      - 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_inventory_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 80:80

volumes:
  db_data:
  media_data:
